name: CI

on:
  push:
    branches:
      - master
      - develop
      - feature/**
      - fix/**
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest

    env:
      NOVA_USERNAME: ${{ secrets.NOVA_USERNAME }}
      NOVA_LICENSE_KEY: ${{ secrets.NOVA_LICENSE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip,xml,dom,xmlreader,fileinfo
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Configure Nova auth
        if: ${{ env.NOVA_USERNAME != '' && env.NOVA_LICENSE_KEY != '' }}
        run: |
          composer config http-basic.nova.laravel.com "${{ env.NOVA_USERNAME }}" "${{ env.NOVA_LICENSE_KEY }}"

      - name: Install deps
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app
        run: |
          cp .env.example .env || true
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: PHPUnit
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: vendor/bin/phpunit --colors=always
